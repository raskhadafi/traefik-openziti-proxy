http:
  routers:
    service-ziti:
      rule: Host(`service.ziti`)
      entryPoints: [web]              # :80
      middlewares: [to-ziti]
      service: noop@internal
    service-ziti-tls:
      rule: Host(`service.ziti`)
      entryPoints: [websecure]        # :443
      tls: {}
      middlewares: [to-ziti]
      service: noop@internal
  middlewares:
    to-ziti:
      plugin:
        openziti:
          service: my-service
          sidecarAddress: http://ziti-sidecar:8900
